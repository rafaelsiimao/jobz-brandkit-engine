        - name: q
          in: query
          required: false
          description: Busca por subdomínio ou nome de divulgação
          schema:
            type: string
      responses:
        "200":
          description: Lista de páginas de carreira retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/companyPage"
                  included:
                    type: array
                    description: Recursos relacionados incluídos conforme parâmetro include
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Cria uma página de carreira
      tags:
        - Páginas de Carreira
      description: |
        Cria uma nova página de carreira.

        ## Upload de Imagens

        Para fazer upload de imagens (logo, avatar, capa, etc.), utilize o content-type `multipart/form-data`.

        **Campos de imagem disponíveis:**
        - `company_page[icon_logo]` - Logo da página (formato: 260x70px, max 1MB)
        - `company_page[header_image]` - Imagem de capa/cabeçalho (formato: 1920x450px, max 2MB)
        - `company_page[avatar]` - Avatar da empresa
        - `company_page[white_logo]` - Logo branca (para fundos escuros)
        - `company_page[exit_modal_image]` - Imagem do modal de saída

        **Formatos aceitos:** JPEG, PNG, WebP, GIF
      operationId: createCompanyPage
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - company_page[subdomain]
                - company_page[disclosure_name]
              properties:
                company_page[subdomain]:
                  type: string
                  description: Subdomínio da página (único)
                company_page[disclosure_name]:
                  type: string
                  description: Nome de divulgação da empresa
                company_page[description]:
                  type: string
                  description: Descrição da página/empresa
                company_page[primary_color]:
                  type: string
                  description: Cor primária (formato hex, ex. #A36FAF)
                company_page[secondary_color]:
                  type: string
                  description: Cor secundária (formato hex, ex. #60C3AD)
                company_page[disposal_type]:
                  type: string
                  enum:
                    - vacancy
                    - manifest
                  description: Tipo de disposição (vacancy = Vagas primeiro, manifest = Sobre primeiro)
                company_page[icon_logo]:
                  type: string
                  format: binary
                  description: |
                    Logo da página.
                    - Formato recomendado: 260x70 pixels
                    - Tamanho máximo: 1MB
                    - Formatos aceitos: JPEG, PNG, WebP, GIF
                company_page[header_image]:
                  type: string
                  format: binary
                  description: |
                    Imagem de capa/cabeçalho.
                    - Formato recomendado: 1920x450 pixels
                    - Tamanho máximo: 2MB
                    - Formatos aceitos: JPEG, PNG, WebP, GIF
                company_page[avatar]:
                  type: string
                  format: binary
                  description: Avatar da empresa
                company_page[white_logo]:
                  type: string
                  format: binary
                  description: |
                    Logo branca para fundos escuros.
                    - Formato recomendado: 260x70 pixels
                    - Tamanho máximo: 1MB
                company_page[exit_modal_image]:
                  type: string
                  format: binary
                  description: Imagem do modal de saída
                company_page[video_url]:
                  type: string
                  description: URL do vídeo institucional
                company_page[video_url_secondary]:
                  type: string
                  description: URL do vídeo secundário
                company_page[video_url_tertiary]:
                  type: string
                  description: URL do vídeo terciário
                company_page[fb_url]:
                  type: string
                  description: URL do Facebook
                company_page[linkedin_id]:
                  type: string
                  description: ID do LinkedIn
                company_page[linkedin_url]:
                  type: string
                  description: URL do LinkedIn
                company_page[instagram]:
                  type: string
                  description: Nome de usuário do Instagram
                company_page[site_url]:
                  type: string
                  description: URL do site da empresa
                company_page[terms_of_service_url]:
                  type: string
                  description: URL dos termos de serviço
                company_page[video_channel_url]:
                  type: string
                  description: URL do canal de vídeo
                company_page[manifest]:
                  type: string
                  description: Manifesto da empresa
                company_page[section_name]:
                  type: string
                  description: Nome da seção
                company_page[use_white_images]:
                  type: boolean
                  description: Usar imagens brancas
                company_page[text_and_icon_header_white]:
                  type: boolean
                  description: Texto e ícone do cabeçalho em branco
                company_page[header_button_background_color]:
                  type: string
                  description: Cor de fundo do botão do cabeçalho (formato hex)
                company_page[header_button_text_color]:
                  type: string
                  description: Cor do texto do botão do cabeçalho (formato hex)
                company_page[header_menu_text_color]:
                  type: string
                  description: Cor do texto do menu do cabeçalho (formato hex)
                company_page[header_menu_text_color_selected]:
                  type: string
                  description: Cor do texto do menu selecionado (formato hex)
                company_page[header_color_icons]:
                  type: string
                  description: Cor dos ícones do cabeçalho (formato hex)
                company_page[cover_image_display]:
                  type: string
                  enum:
                    - center_white_borders
                    - fill_100_page
                  description: Exibição da imagem de capa
                company_page[exit_modal_title]:
                  type: string
                  description: Título do modal de saída
                company_page[exit_modal_message]:
                  type: string
                  description: Mensagem do modal de saída
                company_page[exit_modal_cta_button_title]:
                  type: string
                  description: Título do botão CTA do modal de saída
                company_page[exit_modal_cta_button_link]:
                  type: string
                  description: Link do botão CTA do modal de saída
                company_page[exit_modal_cta_button_background_color]:
                  type: string
                  description: Cor de fundo do botão CTA (formato hex)
                company_page[exit_modal_cta_button_text_color]:
                  type: string
                  description: Cor do texto do botão CTA (formato hex)
                company_page[labels][]:
                  type: array
                  items:
                    type: string
                  description: Labels/tags da página
          application/json:
            schema:
              $ref: "#/components/schemas/companyPageInput"
      responses:
        "201":
          description: Página de carreira criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/companyPage"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
