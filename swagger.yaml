    get:
      summary: Matching de talentos
      tags:
        - Processos Seletivos
      description: |
        Retorna candidatos do banco de talentos ordenados por matching com a vaga.

        O matching considera:
        - Localização
        - Experiência profissional
        - Formação acadêmica
        - Habilidades técnicas
        - Pretensão salarial

        Use para encontrar candidatos compatíveis no banco de talentos da empresa.
      operationId: getSelectionProcessMatching
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          required: false
          description: Termo de busca
          schema:
            type: string
        - name: city_ids[]
          in: query
          required: false
          description: IDs das cidades
