    get:
      summary: Lista candidatos do processo
      tags:
        - Processos Seletivos
      description: |
        Retorna candidatos participando do processo seletivo.

        Use o parâmetro "include" para carregar relacionamentos.

        **Filtros avançados disponíveis** para busca de candidatos.
      operationId: listSelectionProcessCandidates
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Include"
        - name: q
          in: query
          required: false
          description: Termo de busca geral
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filtrar por nome do candidato
          schema:
            type: string
        - name: email
          in: query
          required: false
          description: Filtrar por email
          schema:
            type: string
        - name: cpf
          in: query
          required: false
          description: Filtrar por CPF
          schema:
            type: string
        - name: pipelines_stage_id
          in: query
          required: false
          description: Filtrar por etapa do processo
          schema:
            type: integer
        - name: pipelines_stage_ids[]
          in: query
          required: false
          description: Filtrar por múltiplas etapas
          schema:
            type: array
            items:
              type: integer
        - name: tag_ids[]
          in: query
          required: false
          description: Filtrar por etiquetas
          schema:
            type: array
            items:
              type: integer
        - name: favorites
          in: query
          required: false
          description: Apenas favoritos
          schema:
            type: boolean
        - name: blocklists
          in: query
          required: false
          description: Incluir bloqueados
          schema:
            type: boolean
        - name: seen
          in: query
          required: false
          description: Filtrar por visualizados/não visualizados
          schema:
            type: boolean
        - name: only_screening
          in: query
          required: false
          description: Apenas candidatos em triagem
          schema:
            type: boolean
        - name: only_hiring
          in: query
          required: false
          description: Apenas candidatos para contratação
          schema:
            type: boolean
        - name: deleted
          in: query
          required: false
          description: Incluir desqualificados
          schema:
            type: boolean
        - name: applied_at_from
          in: query
          required: false
          description: Data de candidatura inicial
          schema:
            type: string
            format: date
        - name: applied_at_to
          in: query
          required: false
          description: Data de candidatura final
          schema:
            type: string
            format: date
        - name: sort_by
          in: query
          required: false
          description: Ordenação dos resultados
          schema:
            type: string
            enum:
              - candidatures_desc
              - candidatures_asc
              - name_asc
              - name_desc
              - matching_desc
      responses:
        "200":
          description: Lista de candidatos no processo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/candidate"
                  meta:
                    $ref: "#/components/schemas/selectionProcessMeta"
  /api/company/v1/selection_processes/{id}/candidates/{candidate_id}:
    get:
      summary: Retorna um candidato do processo
      tags:
        - Processos Seletivos
      description: Retorna os detalhes de um candidato específico no contexto do processo seletivo.
      operationId: getSelectionProcessCandidate
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: candidate_id
          in: path
          required: true
          description: ID do candidato
          schema:
            type: integer
        - $ref: "#/components/parameters/Include"
        - name: only_talent
          in: query
          required: false
          description: Buscar candidato mesmo que não esteja no processo
          schema:
            type: boolean
      responses:
        "200":
          description: Candidato encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/candidate"
                  included:
                    type: array
                    description: Recursos relacionados incluídos conforme parâmetro include
                    items:
                      type: object
  /api/company/v1/selection_processes/{id}/candidates_pipeline:
    get:
      summary: Lista candidaturas do pipeline
      tags:
        - Processos Seletivos
      description: |
        Retorna as candidaturas (candidates_pipeline) do processo seletivo.

        Diferente de `/candidates`, este endpoint retorna objetos de candidatura
        com informações específicas do processo (etapa, status, datas).

        Use o parâmetro "include" para carregar relacionamentos.
      operationId: listCandidatesPipeline
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/CandidatesPipelineInclude"
        - name: pipelines_stage_id
          in: query
          required: false
          description: Filtrar por etapa
          schema:
            type: integer
        - name: q[hired_at_not_null]
          in: query
          required: false
          description: Quando igual a 1, retorna somente candidaturas com hired_at preenchido
          schema:
            type: integer
            enum: [1]
      responses:
        "200":
          description: Lista de candidaturas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/candidatesPipeline"
                  meta:
                    $ref: "#/components/schemas/selectionProcessMeta"
