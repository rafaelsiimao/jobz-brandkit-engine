    # ==================== WEBHOOKS SCHEMAS ====================
    webhookSubscription:
      type: object
      description: Subscription de webhook
      properties:
        id:
          type: integer
          description: ID da subscription
        type:
          type: string
          example: webhook_subscription
        attributes:
          type: object
          properties:
            event:
              type: string
              description: Evento que dispara o webhook
              enum:
                - vacancy_created
                - vacancy_updated
                - vacancy_deleted
                - candidature_created
                - candidate_applied
                - candidate_found_by_hunting
                - candidature_updated
                - candidature_screening_to_next_stage
                - candidature_disqualified
                - candidature_requalified
                - candidate_hired
                - admission_finished
                - invite_to_process
                - email_sent
            url:
              type: string
              format: uri
              description: URL que receberá as notificações
    webhookSubscriptionInput:
      type: object
      description: Dados para criar/atualizar webhook subscription
      required:
        - webhook_subscription
      properties:
        webhook_subscription:
          type: object
          required:
            - event
            - url
          properties:
            event:
              type: string
              description: |
                Evento que dispara o webhook.

                **Eventos disponíveis:**
                - `vacancy_created` - Vaga criada
                - `vacancy_updated` - Vaga atualizada
                - `vacancy_deleted` - Vaga excluída
                - `candidature_created` - Candidatura criada
                - `candidate_applied` - Candidato aplicou para vaga
                - `candidate_found_by_hunting` - Candidato encontrado por hunting
                - `candidature_updated` - Candidatura atualizada
                - `candidature_screening_to_next_stage` - Candidato triado
                - `candidature_disqualified` - Candidato desqualificado
                - `candidature_requalified` - Candidato requalificado
                - `candidate_hired` - Candidato contratado
                - `admission_finished` - Admissão finalizada
                - `invite_to_process` - Convite para processo
                - `email_sent` - Email enviado
              enum:
                - vacancy_created
                - vacancy_updated
                - vacancy_deleted
                - candidature_created
                - candidate_applied
                - candidate_found_by_hunting
                - candidature_updated
                - candidature_screening_to_next_stage
                - candidature_disqualified
                - candidature_requalified
                - candidate_hired
                - admission_finished
                - invite_to_process
                - email_sent
            url:
              type: string
              format: uri
              description: URL que receberá as notificações (deve ser HTTPS em produção)
    # ==================== WEBHOOK EVENT PAYLOADS ====================
    webhookEventVacancyCreated:
      type: object
      description: |
        Payload enviado quando uma vaga é criada.
      properties:
