        **Requer** configuração de hunting na vaga.
      operationId: autoHuntingProcess
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Hunting iniciado
  /api/company/v1/selection_processes/{id}/create_ju_matching:
    post:
      summary: Faz o matching com a ju
      tags:
        - Processos Seletivos
      description: |
        Faz ou atualiza o matching com a ju, assistente de recrutamento habilitada por IA,
        de um ou mais candidatos.

        O matching da ju analisa a compatibilidade do candidato com a vaga.
        Aceita `candidates_pipeline_id` (individual) ou `candidates_pipeline_ids` (em massa).
        Em massa, os rematches são enfileirados com intervalo entre candidatos.
      operationId: createJuMatching
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidates_pipeline_id:
                  type: integer
                  description: ID da candidatura (fluxo individual)
                candidates_pipeline_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs das candidaturas (fluxo em massa)
      responses:
        "200":
          description: Matching criado
        "422":
          description: Nenhum candidato informado
