  /api/company/v1/selection_processes/{id}/move_to_another_process:
    post:
      summary: Move candidatos para outro processo seletivo
      tags:
        - Processos Seletivos
      description: |
        Inicia um procedimento assíncrono para mover candidatos para outro processo seletivo.

        O fluxo realiza convite para a vaga vinculada ao `pipeline_id` informado, move os candidatos
        para a etapa definida em `pipelines_stage_id` e, opcionalmente, desqualifica os candidatos no
        processo atual quando `disqualify_from_current_process` for `true`.
      operationId: moveCandidatesToAnotherProcess
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidate_ids
                - pipeline_id
                - pipelines_stage_id
              properties:
                candidate_ids:
                  type: array
                  minItems: 1
                  description: IDs dos candidatos que serão movidos para o outro processo
                  items:
                    oneOf:
                      - type: integer
                      - type: string
                pipeline_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: ID do pipeline de destino (vinculado ao processo seletivo de destino)
                pipelines_stage_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: ID da etapa de destino dentro do pipeline informado
                disqualify_from_current_process:
                  type: boolean
                  default: false
                  description: Se `true`, desqualifica os candidatos do processo seletivo atual após a movimentação
            examples:
              move_candidates_between_processes:
                summary: Mover candidatos sem desqualificar no processo atual
                value:
                  candidate_ids:
                    - "10375203"
                    - "10280357"
                  pipeline_id: 360828
                  pipelines_stage_id: "2398884"
                  disqualify_from_current_process: false
      responses:
        "200":
          description: Procedimento assíncrono criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - status
                properties:
                  token:
                    type: string
                    description: Token do procedimento assíncrono para rastreamento
                  status:
                    type: string
                    description: Status inicial do procedimento assíncrono
                    example: in_progress
              examples:
                async_procedure_started:
                  summary: Resposta de sucesso ao iniciar movimentação assíncrona
                  value:
                    token: "procedure-token"
                    status: "in_progress"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/company/v1/selection_processes/{id}/reevaluate:
    post:
      summary: Reavalia candidatos desqualificados
      tags:
        - Processos Seletivos
      description: |
        Reativa candidatos que foram desqualificados anteriormente.

        Os candidatos voltam a participar do processo seletivo na primeira etapa.
      operationId: reevaluateCandidates
