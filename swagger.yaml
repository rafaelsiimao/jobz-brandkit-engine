        Cada contexto aceita campos específicos.
      properties:
        vacancy:
          type: object
          required:
            - form
          properties:
            # === Campo obrigatório para definir o contexto ===
            form:
              type: string
              description: |
                Define qual contexto de formulário está sendo enviado.
                Cada contexto aceita campos específicos.
              enum:
                - process_data
                - role_description
                - assignments
                - journey_remuneration
                - mobility_location
                - locations
                - additional_info
                - acquirements
                - disclosure
                - process_responsibles
                - approval_type
                - customer_data
                - diversity_and_inclusion
                - candidates_communication
                - process_stages
                - experiences
                - pre_screening
                - setup_ju
