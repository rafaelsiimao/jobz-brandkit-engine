  # ==================== ADMISSÕES ====================
  # Nota: Os endpoints de admissão operam sobre etapas do pipeline (PipelinesStage),
  # respostas de questionários (CandidateQuestion/FormAnswer), não sobre um recurso "Admission" CRUD.
  # O parâmetro {id} representa o ID da etapa do pipeline (pipelines_stage_id) para admission_data,
  # o ID do CandidateQuestion para approve/decline, e o ID do FormAnswer para pdf.

  /api/company/v1/admissions/{id}/candidates/{candidate_id}:
    get:
      summary: Dados de admissão do candidato
      tags:
        - Admissões
      description: |
        Retorna os dados do formulário de admissão preenchido por um candidato em uma etapa específica.

        O parâmetro `id` representa o ID da etapa do pipeline (pipelines_stage_id).

        Retorna as perguntas do formulário de admissão com as respostas do candidato,
        incluindo status de aprovação de cada campo.
      operationId: getAdmissionCandidateData
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da etapa do pipeline (pipelines_stage_id)
          schema:
            type: integer
        - name: candidate_id
          in: path
          required: true
          description: ID do candidato
          schema:
            type: integer
      responses:
        "200":
          description: Dados de admissão do candidato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      form_answer:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID do formulário respondido
                          url:
                            type: string
                            nullable: true
                            description: URL do formulário
                      questions:
                        type: array
                        description: Lista de perguntas com respostas
                        items:
                          type: object
                          properties:
                            answered:
                              type: boolean
                              description: Se a pergunta foi respondida
                            title:
                              type: string
                              description: Título da pergunta
                            question_type:
                              type: string
                              description: Tipo da pergunta (text, select, file, etc)
                            type_of_information:
                              type: string
                              nullable: true
                              description: Tipo de informação solicitada
                            sent_at:
                              type: string
                              nullable: true
                              description: Data de envio (formato DD/MM/YYYY)
                            answer:
                              type: string
                              nullable: true
                              description: Resposta do candidato
                            answer_question_option_ids:
                              type: array
                              items:
                                type: integer
                              description: IDs das opções selecionadas (para perguntas de múltipla escolha)
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  description:
                                    type: string
                              description: Opções disponíveis para a pergunta
                            file_url:
                              type: string
                              nullable: true
                              description: URL do arquivo anexado
                            candidate_question_id:
                              type: integer
                              nullable: true
                              description: ID da resposta do candidato
                            status:
                              type: string
                              description: Status traduzido (Aprovado, Recusado, Não respondido, etc)
                            status_id:
                              type: string
                              description: ID do status (approved, declined, not_answered, pending)
                              enum:
                                - approved
                                - declined
                                - not_answered
                                - pending
        "404":
          $ref: "#/components/responses/NotFound"
  /api/company/v1/admissions/{id}/pdf:
    get:
      summary: PDF do formulário de admissão
      tags:
        - Admissões
      description: |
        Gera e retorna o PDF de um formulário de admissão respondido.

        O parâmetro `id` representa o ID do FormAnswer (formulário respondido).
      operationId: getAdmissionPdf
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do formulário respondido (form_answer_id)
          schema:
            type: integer
      responses:
        "200":
          description: PDF do formulário de admissão
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/company/v1/admissions/{id}/approve:
    put:
      summary: Aprova campo de admissão
      tags:
        - Admissões
      description: |
        Aprova uma resposta específica do formulário de admissão.

        O parâmetro `id` representa o ID do CandidateQuestion (resposta do candidato a uma pergunta).
      operationId: approveAdmission
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da resposta do candidato (candidate_question_id)
          schema:
            type: integer
      responses:
        "200":
          description: Campo aprovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      answered:
                        type: boolean
                      title:
                        type: string
                      question_type:
                        type: string
                      status:
                        type: string
                      status_id:
                        type: string
                        enum:
                          - approved
        "404":
          $ref: "#/components/responses/NotFound"
  /api/company/v1/admissions/{id}/decline:
    put:
      summary: Recusa campo de admissão
      tags:
        - Admissões
      description: |
        Recusa uma resposta específica do formulário de admissão.

        O parâmetro `id` representa o ID do CandidateQuestion (resposta do candidato a uma pergunta).

        Ao recusar, o candidato poderá reenviar o documento/resposta.
      operationId: declineAdmission
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da resposta do candidato (candidate_question_id)
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_question:
                  type: object
                  properties:
                    decline_reason:
                      type: string
                      description: Motivo da recusa (será enviado ao candidato)
      responses:
        "200":
          description: Campo recusado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      answered:
                        type: boolean
                      title:
                        type: string
                      question_type:
                        type: string
                      status:
                        type: string
                      status_id:
                        type: string
                        enum:
                          - declined
        "404":
          $ref: "#/components/responses/NotFound"

