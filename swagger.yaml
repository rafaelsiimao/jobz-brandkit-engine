  # ==================== COMENTÁRIOS ====================
  /api/company/v1/comments:
    post:
      summary: Cria comentário
      tags:
        - Comentários
      description: |
        Cria um novo comentário em um pipeline/candidatura.

        O comentário pode ser associado a um pipeline e/ou candidato específico.
        Use `mention_ids` para mencionar usuários no comentário.
      operationId: createComment
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: object
                  required:
                    - text
                  properties:
                    pipeline_id:
                      type: integer
                      description: ID do pipeline (processo seletivo)
                    candidate_id:
                      type: integer
                      description: ID do candidato
                    text:
                      type: string
                      description: Texto do comentário
                    mention_ids:
                      type: array
                      description: IDs dos usuários mencionados no comentário
                      items:
                        type: integer
            examples:
              basic:
                summary: Comentário básico
                value:
                  comment:
                    pipeline_id: 123
                    candidate_id: 456
                    text: "Candidato aprovado para próxima etapa"
              with_mentions:
                summary: Comentário com menções
                value:
                  comment:
                    pipeline_id: 123
                    candidate_id: 456
                    text: "Candidato aprovado. @user1 @user2"
                    mention_ids: [1, 2]
      responses:
        "201":
          description: Comentário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        example: "comment"
                      attributes:
                        type: object
                        properties:
                          text:
                            type: string
                            description: Texto do comentário
                          created_at:
                            type: string
                            format: date-time
                          vacancy_id:
                            type: integer
                            nullable: true
                            description: ID da vaga (calculado a partir do pipeline)
                          created_by:
                            type: string
                            description: Nome do usuário que criou o comentário
                      relationships:
                        type: object
                        properties:
                          candidates_pipeline:
                            type: object
                            nullable: true
                          candidate:
                            type: object
                            nullable: true
                          company_users:
                            type: object
                            description: Usuários mencionados no comentário
                      meta:
                        type: object
                        properties:
                          as_timeline:
                            type: boolean
                            description: Indica se o comentário deve aparecer na timeline
                  included:
                    type: array
                    description: Recursos relacionados incluídos
                    items:
                      type: object
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/company/v1/comments/{id}:
    patch:
      summary: Atualiza comentário
      tags:
        - Comentários
      description: |
        Atualiza um comentário existente.

        Permite atualizar o texto e as menções de usuários.
      operationId: updateComment
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: object
                  properties:
                    text:
                      type: string
                      description: Novo texto do comentário
                    mention_ids:
                      type: array
                      description: IDs dos usuários mencionados no comentário
                      items:
                        type: integer
            examples:
              update_text:
                summary: Atualizar apenas o texto
                value:
                  comment:
                    text: "Texto atualizado do comentário"
              update_with_mentions:
                summary: Atualizar texto e menções
                value:
                  comment:
                    text: "Texto atualizado com menções @user1"
                    mention_ids: [1, 2]
      responses:
        "200":
          description: Comentário atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        example: "comment"
                      attributes:
                        type: object
                        properties:
                          text:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          vacancy_id:
                            type: integer
                            nullable: true
                          created_by:
                            type: string
                      relationships:
                        type: object
                        properties:
                          candidates_pipeline:
                            type: object
                            nullable: true
                          candidate:
                            type: object
                            nullable: true
                          company_users:
                            type: object
                      meta:
                        type: object
                        properties:
                          as_timeline:
                            type: boolean
                  included:
                    type: array
                    description: Recursos relacionados incluídos
                    items:
                      type: object
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: Remove comentário
      tags:
        - Comentários
      description: Remove um comentário do sistema
      operationId: deleteComment
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Comentário removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        example: "comment"
                  message:
                    type: string
                    example: "Comentário removido com sucesso"
        "404":
          $ref: "#/components/responses/NotFound"

