  # ==================== API PÚBLICA - EMPRESAS (DESABILITADO) ====================
  # Endpoints removidos em 2026-02-21 — Incidente de segurança (IDOR).
  # Rotas comentadas em config/routes.rb e controller desabilitado.
  # ==================== WEBHOOKS ====================
  /v1/subscriptions:
    get:
      summary: Lista webhook subscriptions
      tags:
        - Webhooks
      description: |
        Retorna a lista de webhook subscriptions cadastradas pela empresa.

        Cada empresa pode ter apenas uma subscription por evento.
      operationId: listWebhookSubscriptions
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Lista de webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/webhookSubscription"
                  meta:
                    $ref: "#/components/schemas/pagination"
              example:
                data:
                  - id: 1
                    type: webhook_subscription
                    attributes:
                      event: vacancy_created
                      url: "https://webhook.site/a679aac8-d684"
                  - id: 2
                    type: webhook_subscription
                    attributes:
                      event: vacancy_deleted
                      url: "https://webhook.site/a679aac8-d685"
                meta:
                  count: 2
                  items: 2
                  page: 1
                  prev: null
                  next: null
                  last: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      summary: Cria webhook subscription
      tags:
        - Webhooks
      description: |
        Cadastra uma nova webhook subscription para a empresa.

        **Importante**: Cada empresa pode ter apenas uma subscription por evento.
        Se já existir uma subscription para o evento informado, será retornado erro 422.

        ## Eventos disponíveis

        - `vacancy_created` - Vaga criada
        - `vacancy_updated` - Vaga atualizada
        - `vacancy_deleted` - Vaga excluída
        - `candidature_created` - Candidatura criada
        - `candidate_applied` - Candidato aplicou para vaga
        - `candidate_found_by_hunting` - Candidato encontrado por hunting
        - `candidature_updated` - Candidatura atualizada
        - `candidature_screening_to_next_stage` - Candidato triado para próxima etapa
        - `candidature_disqualified` - Candidato desqualificado
        - `candidature_requalified` - Candidato requalificado
        - `candidate_hired` - Candidato contratado
        - `admission_finished` - Admissão finalizada
        - `invite_to_process` - Convite para processo
        - `email_sent` - Email enviado
      operationId: createWebhookSubscription
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/webhookSubscriptionInput"
            example:
              webhook_subscription:
                event: vacancy_created
                url: "https://webhook.com.br"
      responses:
        "200":
          description: Webhook subscription criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/webhookSubscription"
              example:
                data:
                  id: 1
                  type: webhook_subscription
                  attributes:
                    event: vacancy_created
                    url: "https://webhook.site/a679aac8-d684"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/subscriptions/{id}:
    get:
      summary: Busca webhook subscription pelo ID
      tags:
        - Webhooks
      description: Retorna os detalhes de uma webhook subscription específica.
      operationId: getWebhookSubscription
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da webhook subscription
          schema:
            type: integer
      responses:
        "200":
          description: Webhook subscription encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/webhookSubscription"
              example:
                data:
                  id: 1
                  type: webhook_subscription
                  attributes:
                    event: vacancy_created
                    url: "https://webhook.site/a679aac8-d684"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    patch:
      summary: Atualiza webhook subscription
      tags:
        - Webhooks
      description: |
        Atualiza uma webhook subscription existente.

        Você pode atualizar o evento e/ou a URL da subscription.
      operationId: updateWebhookSubscription
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da webhook subscription
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/webhookSubscriptionInput"
            example:
              webhook_subscription:
                event: vacancy_updated
                url: "https://novo-webhook.com.br"
      responses:
        "200":
          description: Webhook subscription atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/webhookSubscription"
              example:
                data:
                  id: 1
                  type: webhook_subscription
                  attributes:
                    event: vacancy_updated
                    url: "https://novo-webhook.com.br"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: Remove webhook subscription
      tags:
        - Webhooks
      description: Remove uma webhook subscription. Após a remoção, a empresa não receberá mais notificações do evento.
      operationId: deleteWebhookSubscription
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da webhook subscription
          schema:
            type: integer
      responses:
        "200":
          description: Webhook subscription removida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/webhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ==================== COMPONENTES ====================

components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-INT-TOKEN
      in: header
      description: |
        Token de integração da empresa para endpoints do ATS.

        O token pode ser obtido em:
        1. Acesse a conta da empresa na plataforma abler;
        2. Clique em "Configurações" na página de início;
        3. Na aba Dados da sua empresa, vá para o fim da página até chegar em "Integrações";
        4. Crie o token e use ele na sua aplicação.
  parameters:
    Include:
      name: include
      in: query
      required: false
      description: Relacionamentos de candidato a incluir na resposta
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - address
            - disability
            - area_of_interests
            - candidate_areas
            - candidate_level_of_interests
            - candidates_languages
            - complementary_trainings
            - educational_profiles
            - level_of_interests
            - national_experiences
            - vacancies
            - candidate_markers
            - candidate_rankdone_tests
            - candidate_questions
            - questions
            - candidates_pipelines
            - comments
            - attachments
            - candidate_pipeline_follow_ups
    VacancyInclude:
      name: include
      in: query
      required: false
      description: Relacionamentos de vaga a incluir na resposta
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - team
            - company
            - area_of_formation
            - level_of_interest
            - responsible
            - area_of_interests
            - skills
            - vacancies_benefits
            - vacancies_languages
            - complementary_formations
            - vacancy_analysts
            - vacancy_managers
            - address
            - vacancy_admission_info
            - experience_tag
            - customer_contact
            - customer
            - customer_cost_center
            - seller
            - pipeline
            - vacancy_approvers
            - states
            - cities
            - company_pages
            - questions
            - comments
            - attachments
    CompanyPageInclude:
      name: include
      in: query
      required: false
      description: Relacionamentos de página de carreira a incluir na resposta
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - company
            - company_page_contents
            - company_config_images
    CandidatesPipelineInclude:
      name: include
      in: query
      required: false
      description: Relacionamentos de candidatura a incluir na resposta
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - tag
            - pipeline
            - candidate
            - hiring_responsible_company_user
            - pipelines_stage
            - attachments
            - candidates_pipeline_feedbacks
            - tags
            - vacancy
    Page:
      name: page
      in: query
      required: false
      description: Número da página (padrão 1)
      schema:
        type: integer
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Itens por página (padrão 15, máximo 100)
      schema:
        type: integer
        default: 15
        maximum: 100
    ResourceId:
      name: id
      in: path
      required: true
      description: ID do recurso
      schema:
        type: string
  responses:
    Unauthorized:
      description: API Key inválida ou ausente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
    Forbidden:
      description: Acesso negado - Origin não permitido ou sem permissão
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              code:
                type: string
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
    UnprocessableEntity:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
  schemas:
    error:
      type: object
      properties:
        status:
          type: string
