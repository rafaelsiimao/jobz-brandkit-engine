  # ==================== PÁGINAS DE CARREIRA ====================
  /api/company/v1/company_pages:
    get:
      summary: Lista páginas de carreira
      tags:
        - Páginas de Carreira
      description: |
        Retorna a lista de páginas de carreira da empresa.

        Use o parâmetro "include" para carregar relacionamentos.
      operationId: listCompanyPages
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
