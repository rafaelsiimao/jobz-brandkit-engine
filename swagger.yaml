    post:
      summary: Cria um novo candidato
      tags:
        - Candidatos
      description: Cria um novo candidato no banco de talentos da empresa
      operationId: createCandidate
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/candidateInput"
      responses:
        "201":
          description: Candidato criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/candidate"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/company/v1/candidates/{id}:
    get:
      summary: Retorna um candidato
      tags:
        - Candidatos
      description: |
        Retorna os detalhes de um candidato específico.

        Use o parâmetro "include" para carregar relacionamentos (separados por vírgula).
      operationId: getCandidate
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: Candidato encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/candidate"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atualiza um candidato
      tags:
        - Candidatos
      description: |
        Atualiza os dados de um candidato.

        **Campos permitidos**: email, linkedin_url, cv_attachment
      operationId: updateCandidate
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/candidateUpdateInput"
      responses:
        "200":
          description: Candidato atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/candidate"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/company/v1/candidates/{id}/vacancies:
    get:
      summary: Lista vagas do candidato
      tags:
        - Candidatos
      description: Retorna as vagas em que o candidato está participando
      operationId: listCandidateVacancies
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Lista de vagas do candidato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/vacancy"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/company/v1/candidates/{id}/cv_pdf:
    get:
      summary: Gera PDF do currículo
      tags:
        - Candidatos
      description: Gera e retorna o PDF do currículo do candidato
      operationId: getCandidateCvPdf
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: candidates_pipeline_feedback_id
          in: query
          required: false
          description: ID do feedback da candidatura para incluir no PDF
          schema:
            type: integer
        - name: hidden_fields[]
          in: query
          required: false
          description: Campos a ocultar no PDF
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: PDF do currículo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/company/v1/candidates/{id}/request_cv_update:
    post:
      summary: Solicita atualização de currículo
      tags:
        - Candidatos
      description: Envia email solicitando que o candidato atualize seu currículo
      operationId: requestCandidateCvUpdate
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Solicitação enviada com sucesso
        "404":
          $ref: "#/components/responses/NotFound"
  /api/company/v1/candidates/{id}/basic_info:
    get:
      summary: Informações básicas do candidato
      tags:
        - Candidatos
      description: Retorna informações básicas do perfil do candidato
      operationId: getCandidateBasicInfo
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Informações básicas
  /api/company/v1/candidates/{id}/timeline:
    get:
      summary: Timeline do candidato
      tags:
        - Candidatos
      description: Retorna o histórico de interações do candidato
      operationId: getCandidateTimeline
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: pipeline_id
          in: query
          required: false
          description: ID do pipeline para filtrar timeline
          schema:
            type: integer
      responses:
        "200":
          description: Timeline do candidato
  /api/company/v1/candidates/verify_existence:
    get:
      summary: Verifica se candidato existe
      tags:
        - Candidatos
      description: Verifica se já existe um candidato com o email ou identificador do LinkedIn informado
      operationId: verifyCandidateExistence
      security:
        - api_key: []
      parameters:
        - name: email
          in: query
          required: false
          description: Email a verificar
          schema:
            type: string
            format: email
        - name: linkedin_identifier
          in: query
          required: false
          description: "Identificador público do LinkedIn (ex.: vitor-ac)"
          schema:
            type: string
      responses:
        "200":
          description: Resultado da verificação
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidate_exists:
                    type: boolean
  /api/company/v1/candidates/{id}/favorite:
    patch:
      summary: Favorita/desfavorita candidato
      tags:
        - Candidatos
      description: |
        Marca ou desmarca um candidato como favorito.

        Candidatos favoritos aparecem destacados nas listagens.
      operationId: toggleFavoriteCandidate
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_markers:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Motivo/descrição do favorito
      responses:
        "200":
          description: Status de favorito alterado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/candidate"
  /api/company/v1/candidates/{id}/blocklist:
    patch:
      summary: Bloqueia/desbloqueia candidato
      tags:
        - Candidatos
      description: |
        Adiciona ou remove candidato da lista de bloqueio.

        Candidatos bloqueados não aparecem nas buscas e não podem se candidatar às vagas.
      operationId: toggleBlocklistCandidate
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_markers:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Motivo do bloqueio
      responses:
        "200":
          description: Status de bloqueio alterado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/candidate"
  /api/company/v1/candidates/invite:
    post:
      summary: Convida candidatos para vaga
      tags:
        - Candidatos
      description: |
        Envia convite para candidatos participarem de um processo seletivo.

        O candidato receberá um email de convite e será adicionado à etapa inicial do processo.
      operationId: inviteCandidates
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidate
              properties:
                candidate:
                  type: object
                  required:
                    - candidate_ids
                    - pipeline_id
                  properties:
                    candidate_ids:
                      type: array
                      items:
                        type: integer
                      description: IDs dos candidatos a convidar
                    pipeline_id:
                      type: integer
                      description: ID do pipeline (processo seletivo da vaga)
                    send_screening_questions:
                      type: boolean
                      description: Enviar perguntas de triagem junto com o convite
      responses:
        "200":
          description: Convites enviados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          example: candidates_pipeline
  /api/company/v1/candidates/request_cv_update:
    post:
      summary: Solicita atualização de CV em lote
      tags:
        - Candidatos
      description: |
        Envia solicitação de atualização de currículo para múltiplos candidatos.

        Os candidatos receberão um email solicitando que atualizem seus dados.
      operationId: bulkRequestCvUpdate
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidate_ids
              properties:
                candidate_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs dos candidatos
      responses:
        "200":
          description: Solicitações enviadas
  /api/company/v1/candidates/create_in_batch:
    post:
      summary: Cria candidatos em lote
      tags:
        - Candidatos
      description: |
        Importa múltiplos candidatos de uma vez através de arquivo ou dados estruturados.

        **Processamento assíncrono** - A resposta indica que o processamento foi iniciado.
      operationId: createCandidatesInBatch
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de importação (XLSX, CSV)
                pipeline_id:
                  type: integer
                  description: ID do pipeline para vincular os candidatos importados (opcional)
      responses:
        "200":
          description: Importação iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Mensagem de confirmação
  /api/company/v1/candidates/{id}/tags:
    get:
      summary: Tags do candidato
      tags:
        - Candidatos
      description: |
        Retorna as tags (etiquetas) associadas ao candidato no contexto de um processo seletivo.
      operationId: getCandidateTags
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: pipeline_id
          in: query
          required: false
          description: ID do pipeline para filtrar tags
          schema:
            type: integer
      responses:
        "200":
          description: Tags do candidato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        color:
                          type: string
  /api/company/v1/candidates/{id}/bio:
    get:
      summary: Biografia do candidato
      tags:
        - Candidatos
      description: Retorna a carta de apresentação/biografia do candidato.
      operationId: getCandidateBio
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Biografia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cover_letter:
                        type: string
                        nullable: true
                        description: Carta de apresentação
  /api/company/v1/candidates/{id}/professional_summary:
    get:
      summary: Resumo profissional
      tags:
        - Candidatos
      description: Retorna o resumo profissional do candidato (áreas de interesse, cargos, habilidades).
      operationId: getCandidateProfessionalSummary
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resumo profissional
          content:
            application/json:
              schema:
                type: object
                properties:
                  area_of_interests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  level_of_interests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  salary_intended:
                    type: number
                    nullable: true
                  salary_intended_max:
                    type: number
                    nullable: true
                  work_type:
                    type: array
                    items:
                      type: string
  /api/company/v1/candidates/{id}/knowledge:
    get:
      summary: Conhecimentos do candidato
      tags:
        - Candidatos
      description: Retorna os conhecimentos (formação, idiomas, cursos) do candidato.
      operationId: getCandidateKnowledge
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Conhecimentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  educational_profiles:
                    type: array
                    description: Formações acadêmicas
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        course:
                          type: string
                        institution:
                          type: string
                        level:
                          type: string
                        status:
                          type: string
                        start_year:
                          type: integer
                        end_year:
                          type: integer
                          nullable: true
                  candidates_languages:
                    type: array
                    description: Idiomas
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        language_name:
                          type: string
                        level:
                          type: string
                  complementary_trainings:
                    type: array
                    description: Cursos complementares
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        course:
                          type: string
                        institution:
                          type: string
  /api/company/v1/candidates/{id}/experiences:
    get:
      summary: Experiências profissionais
      tags:
        - Candidatos
      description: Retorna as experiências profissionais do candidato.
      operationId: getCandidateExperiences
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Experiências
          content:
            application/json:
              schema:
                type: object
                properties:
                  national_experiences:
                    type: array
                    description: Experiências nacionais
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        company:
                          type: string
                        role_name:
                          type: string
                        start_date:
                          type: string
                          format: date
                        end_date:
                          type: string
                          format: date
                          nullable: true
                        current:
                          type: boolean
                        activities:
                          type: string
                        last_salary:
                          type: number
                          nullable: true
  /api/company/v1/candidates/{id}/diversity:
    get:
      summary: Dados de diversidade
      tags:
        - Candidatos
      description: |
        Retorna informações de diversidade e inclusão do candidato.

        **Dados sensíveis** - Uso restrito conforme LGPD.
      operationId: getCandidateDiversity
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Dados de diversidade
          content:
            application/json:
              schema:
                type: object
                properties:
                  gender:
                    type: string
                    nullable: true
                  gender_identity:
                    type: string
                    nullable: true
