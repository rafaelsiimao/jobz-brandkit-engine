    get:
      summary: Lista etapas do processo
      tags:
        - Processos Seletivos
      description: |
        Retorna as etapas (pipeline stages) do processo seletivo.

        **Etapas padrão**: Triagem, Testes, Entrevistas, Qualificação, Dinâmica, Finalistas, Contratação.
      operationId: listSelectionProcessStages
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Lista de etapas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/pipelinesStage"
  /api/company/v1/selection_processes/{id}/stages/{pipelines_stage_id}/candidates:
    get:
      summary: Lista candidatos de uma etapa
      tags:
        - Processos Seletivos
      description: |
        Retorna candidatos que estão em uma etapa específica do processo seletivo.
      operationId: listCandidatesFromStage
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: pipelines_stage_id
          in: path
          required: true
          description: ID da etapa do pipeline
          schema:
            type: integer
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: Lista de candidatos na etapa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/candidate"
                  meta:
                    $ref: "#/components/schemas/pagination"
