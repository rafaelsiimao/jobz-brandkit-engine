  /api/company/v1/custom_emails:
    get:
      summary: Lista emails personalizados
      tags:
        - Emails
      description: |
        Retorna lista de emails personalizados configurados.

        Use o parâmetro "include" para carregar relacionamentos.
      operationId: listCustomEmails
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: Lista de emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          example: "custom_email"
                        attributes:
                          type: object
                          properties:
                            content:
                              type: string
                              description: Conteúdo do email (HTML)
                            title:
                              type: string
                              description: Título do template
                            description:
                              type: string
                              nullable: true
                              description: Descrição do template
                            slug:
                              type: string
                              description: Slug do template
                            subject:
                              type: string
                              description: Assunto do email
                            category:
                              type: string
                              description: Categoria traduzida
                            category_value:
                              type: string
                              description: Valor bruto da categoria
                            created_by:
                              type: string
                              nullable: true
                              description: Nome do usuário que criou
                            updated_by:
                              type: string
                              nullable: true
                              description: Nome do usuário que atualizou
                            created_at:
                              type: string
                              description: Data de criação formatada
                            updated_at:
                              type: string
                              description: Data de atualização formatada
                        relationships:
                          type: object
                          properties:
                            company:
                              type: object
                  included:
                    type: array
                    description: Recursos relacionados incluídos conforme parâmetro include
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Cria email personalizado
      tags:
        - Emails
      description: |
        Cria um novo email personalizado.

        O email será criado com `slug: "custom_user_template"` e `category: "user_template"` automaticamente.
      operationId: createCustomEmail
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - custom_email
              properties:
                custom_email:
                  type: object
                  required:
                    - subject
                  properties:
                    title:
                      type: string
                      description: Título do template
                    description:
                      type: string
                      description: Descrição do template
                    content:
                      type: string
                      description: Conteúdo do email (HTML permitido, pode usar variáveis como [[CANDIDATE_NAME]], [[COMPANY_NAME]], [[VACANCY_TITLE]])
                    subject:
                      type: string
                      description: Assunto do email
            examples:
              basic:
                summary: Email básico
                value:
                  custom_email:
                    title: "Convite para processo seletivo"
                    subject: "Você foi convidado para participar"
                    content: "<p>Olá [[CANDIDATE_NAME]], você foi convidado para participar do processo seletivo [[VACANCY_TITLE]].</p>"
              with_description:
                summary: Email com descrição
                value:
                  custom_email:
                    title: "Email de boas-vindas"
                    description: "Email enviado quando candidato é aprovado"
                    subject: "Bem-vindo à nossa empresa!"
                    content: "<h1>Parabéns [[CANDIDATE_NAME]]!</h1><p>Você foi aprovado para a vaga [[VACANCY_TITLE]] na empresa [[COMPANY_NAME]].</p>"
      responses:
        "201":
          description: Email criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
