                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/candidatesPipeline"
  /api/company/v1/selection_processes/{id}/hire:
    post:
      summary: Contrata candidatos
      tags:
        - Processos Seletivos
      description: |
        Marca candidatos como contratados no processo seletivo.

        Os candidatos são movidos para a etapa de contratação e podem ter dados de admissão preenchidos.
      operationId: hireCandidates
