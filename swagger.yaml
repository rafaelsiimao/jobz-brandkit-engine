              - default
              - template
        - name: exclusive_pcd
          in: query
          required: false
          description: Filtrar vagas exclusivas para PCD
          schema:
            type: boolean
        - name: created_at_from
          in: query
          required: false
          description: Data de criação (início)
          schema:
            type: string
            format: date
        - name: created_at_to
          in: query
          required: false
          description: Data de criação (fim)
          schema:
            type: string
            format: date
        - name: close_on_from
          in: query
          required: false
          description: Data de fechamento previsto (início)
          schema:
            type: string
            format: date
        - name: close_on_to
          in: query
          required: false
          description: Data de fechamento previsto (fim)
          schema:
            type: string
            format: date
        - name: customer_ids[]
          in: query
          required: false
          description: IDs dos clientes (para consultorias)
          schema:
            type: array
            items:
              type: integer
        - name: team_ids[]
          in: query
          required: false
          description: IDs dos times
          schema:
            type: array
            items:
              type: integer
        - name: responsible_ids[]
          in: query
          required: false
          description: IDs dos responsáveis
          schema:
            type: array
            items:
              type: integer
        - name: analyst_ids[]
          in: query
          required: false
          description: IDs dos analistas
          schema:
            type: array
            items:
              type: integer
        - name: area_of_interest_ids[]
          in: query
          required: false
          description: IDs das áreas de interesse
          schema:
            type: array
            items:
              type: integer
        - name: level_of_interest_ids[]
          in: query
          required: false
          description: IDs dos níveis/cargos
          schema:
            type: array
            items:
              type: integer
        - name: city_ids[]
          in: query
          required: false
          description: IDs das cidades
          schema:
            type: array
            items:
              type: integer
        - name: contracting_regimes[]
          in: query
          required: false
          description: Regimes de contratação
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Lista de vagas retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/vacancy"
                  included:
                    type: array
                    description: Recursos relacionados incluídos conforme parâmetro include
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Cria uma nova vaga
      tags:
        - Vagas
      description: |
        Cria uma nova vaga no sistema.

        A criação de vaga usa um sistema de formulários por contexto. 
        O campo `form` define qual contexto está sendo enviado.

        **Contextos disponíveis (form)**:
        - `process_data` - Dados básicos do processo (título, regime, tipo)
        - `role_description` - Descrição do cargo
        - `assignments` - Atribuições (senioridade, cargo, salário)
        - `journey_remuneration` - Jornada e remuneração
        - `mobility_location` - Localização e mobilidade
        - `acquirements` - Requisitos (escolaridade, idiomas)
        - `disclosure` - Divulgação
        - `process_responsibles` - Responsáveis
        - `customer_data` - Dados do cliente (consultorias)
        - `diversity_and_inclusion` - Diversidade e inclusão

        **Recomendação**: Envie primeiro `process_data` para criar a vaga, depois atualize com os demais contextos usando PATCH.

        **Exemplo - Criar vaga básica**:
        ```json
        {
          "vacancy": {
            "form": "process_data",
            "title": "Desenvolvedor Python",
            "quantity": 1,
            "contracting_regime": "CLT",
            "requisition_type": "expansao"
          }
        }
        ```

        **Exemplo - Atualizar descrição (via PATCH)**:
        ```json
        {
          "vacancy": {
            "form": "role_description",
            "description": "<p>Sobre a vaga...</p>",
            "mandatory_requirements": "<p>Requisitos obrigatórios...</p>",
            "desirable_requirements": "<p>Requisitos desejáveis...</p>"
          }
        }
        ```

        **Exemplo - Definir localização (via PATCH)**:
        ```json
        {
          "vacancy": {
            "form": "mobility_location",
            "country": "Brasil",
            "state": "São Paulo",
            "city": "São Paulo",
            "work_type": ["hibrida"]
          }
        }
        ```
      operationId: createVacancy
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/vacancyInput"
            examples:
              process_data:
                summary: Criar vaga básica
                value:
                  vacancy:
                    form: process_data
                    title: Desenvolvedor Python
                    quantity: 1
                    contracting_regime: CLT
                    requisition_type: expansao
              role_description:
                summary: Definir descrição
                value:
                  vacancy:
                    form: role_description
                    description: "<h3>Sobre a vaga</h3><p>Descrição detalhada...</p>"
                    mandatory_requirements: "<ul><li>Requisito 1</li><li>Requisito 2</li></ul>"
                    desirable_requirements: "<ul><li>Desejável 1</li></ul>"
              mobility_location:
                summary: Definir localização
                value:
                  vacancy:
                    form: mobility_location
                    country: Brasil
                    state: São Paulo
                    city: São Paulo
                    work_type:
                      - hibrida
      responses:
        "201":
          description: Vaga criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/vacancy"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
