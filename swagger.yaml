---
openapi: 3.0.1
info:
  title: abler ATS API V2
  version: v2
  description: |
    API para integração com o sistema de recrutamento e seleção da abler.

    ## Autenticação

    Todas as requisições devem incluir o header `X-API-INT-TOKEN` com o token de integração da empresa.

    Caso seu plano tenha acesso a API da abler, você pode obter o token em: **Configurações > Dados da empresa > Integrações > Token de Acesso**.
    OBS: Apenas o plano "Elite" possui acesso a API da abler. Entre em contato com o time de suporte da abler para saber mais.

    ## Rate Limiting

    - 300 requisições por 5 minutos por IP
    - 5 requisições por segundo para endpoints de autenticação
  contact:
    name: Suporte da abler
    email: suporte@abler.com.br
servers:
  - url: https://hulk-smash.abler.com.br
    description: Production (ATS)
  - url: https://hulk-smash.getabler.com
    description: Staging (ATS)
  - url: http://lvh.localhost:3000
    description: Development (ATS)
  - url: https://api.abler.com.br
    description: Production (API Pública - Webhooks)
  - url: https://api.getabler.com
    description: Staging (API Pública - Webhooks)
  - url: http://api.lvh.localhost:3000
    description: Development (API Pública - Webhooks)
tags:
  - name: Candidatos
    description: Gerenciamento de candidatos no banco de talentos
  - name: Vagas
    description: Gerenciamento de vagas
  - name: Processos Seletivos
    description: Gerenciamento de processos seletivos e candidaturas
  - name: Páginas de Carreira
    description: Gerenciamento de páginas de carreira (career pages)
  - name: Empresa
    description: Dados da empresa
  - name: Clientes
    description: Clientes (para consultorias)
  - name: Comentários
    description: Gerenciamento de comentários
  - name: Templates
    description: Gerenciamento de templates
  - name: Emails
    description: Gerenciamento de emails
  - name: Feedbacks
    description: Gerenciamento de feedbacks
  - name: Admissões
    description: Gerenciamento de admissões
  - name: Webhooks
    description: Gerenciamento de webhooks para integração com sistemas externos.
  - name: Coleções
    description: Dados auxiliares (listas, enums, etc)
  # Tag "API Pública - Empresas" removida em 2026-02-21 — Endpoints desabilitados (IDOR).

paths:
  # ==================== CANDIDATOS ====================
  /api/company/v1/candidates:
    # NOTE: GET endpoint commented out - should not appear in public documentation
