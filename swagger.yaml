    #   responses:
    #     '200':
    #       description: Lista de candidatos retornada com sucesso
    #       content:
    #         application/json:
    #           schema:
    #             type: object
    #             properties:
    #               data:
    #                 type: array
    #                 items:
    #                   $ref: '#/components/schemas/candidate'
